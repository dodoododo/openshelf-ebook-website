spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:openshelf_db}
    username: ${POSTGRES_USER:openshelf}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      cookie:
        name: openshelf-session
        secure: false

logging:
  level:
    root: INFO
    com.openshelf: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
