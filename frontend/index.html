<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2ea" />
    <meta name="description" content="A quieter home for your reading life. Discover OpenShelf, a personal space for books and the chapters you return to." />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("openshelf-theme"); } catch {}
        document.documentElement.dataset.theme = preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      })();
    </script>
    <title>OpenShelf — Digital Library &amp; Social Reading</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
