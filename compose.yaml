services:
  db:
    image: postgres:17-alpine
    container_name: openshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openshelf_db}
      POSTGRES_USER: ${POSTGRES_USER:-openshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openshelf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openshelf} -d ${POSTGRES_DB:-openshelf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  openshelf_pgdata:
    name: openshelf_pgdata
